function musicTone(freq,dur,vol,type='triangle',at=0){
 if(!audioContext||!soundOn)return;
 const now=audioContext.currentTime+at,o=audioContext.createOscillator(),a=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);
 if(type==='sine')o.frequency.exponentialRampToValueAtTime(Math.max(38,freq*.57),now+dur);
 a.gain.setValueAtTime(.0001,now);a.gain.linearRampToValueAtTime(Math.min(.2,vol*1.45),now+.009);a.gain.exponentialRampToValueAtTime(.0001,now+dur);
 o.connect(a);a.connect(audioChannel==='se'?seBus:bgmBus);o.start(now);o.stop(now+dur+.025);
}
function music(dt){
 if(!soundOn||mode!=='playing')return;
 if(!ensureAudio()||audioContext.state!=='running')return;
 musicClock-=dt;let guard=0;
 while(musicClock<=0&&guard++<3){
  const bossOn=!!(boss&&!boss.used),hot=fever&&!bossOn,tempo=bossOn?.124:hot?.099:.113;
  musicClock+=tempo;
  const step=musicStep++%64,beat=step%16,bar=Math.floor(step/16);
  const roots=bossOn?[55,58.27,49,55]:hot?[73.42,82.41,65.41,73.42]:[65.41,58.27,61.74,55],root=roots[bar];
  if(beat%4===0)musicTone(beat===0?132:104,.17,bossOn?.093:hot?.082:.071,'sine');
  if(beat===4||beat===12){musicTone(180,.078,bossOn?.042:.033,'sawtooth');musicTone(370,.045,.009,'square')}
  if(beat%2===0||hot)musicTone(4500,.021,hot?.009:.006,'square');
  if(beat%2===0)musicTone(root*(beat===6?2:1),.21,bossOn?.030:hot?.030:.027,'sawtooth');
  const lead=bossOn?[0,3,7,10,12,10,7,3,0,5,7,12,15,12,10,7]:hot?[0,7,12,7,10,12,14,12,7,5,7,12,10,7,5,3]:[0,7,10,7,12,10,7,5,0,7,10,14,12,10,7,5];
  if(beat%2===1||hot&&beat%2===0)musicTone(root*4*Math.pow(2,lead[beat]/12),hot?.085:.13,bossOn?.021:hot?.024:.020,'triangle');
  if(beat===0||beat===8)musicTone(root*2*Math.pow(2,(bossOn?3:hot?7:4)/12),.34,.011,'sine');
 }
}
function sfx(kind){
 if(!soundOn||!audioContext||audioContext.state!=='running')return;
 const gap={shot:.10,hit:.13,bossHit:.15,crateHit:.12,kill:.12,fever:.6}[kind]||0;
 if(sfxTimes[kind]!==undefined&&t-sfxTimes[kind]<gap)return;
 sfxTimes[kind]=t;audioChannel='se';
 if(kind==='shot'){musicTone(player.weapon>=5?495:395,.035,.021,'sawtooth');musicTone(180,.045,.014,'triangle')}
 else if(kind==='hit')musicTone(270,.040,.022,'triangle');
 else if(kind==='bossHit')musicTone(180,.07,.019,'sawtooth');
 else if(kind==='crateHit')musicTone(520,.045,.024,'square');
 else if(kind==='crateOpen'){musicTone(660,.11,.053,'triangle');musicTone(990,.15,.046,'triangle',.07)}
 else if(kind==='pickup'){musicTone(760,.12,.047,'triangle');musicTone(1140,.15,.040,'triangle',.09)}
 else if(kind==='kill'){musicTone(540,.075,.020,'triangle');musicTone(810,.075,.018,'triangle',.045)}
 else if(kind==='fever'){for(let i=0;i<4;i++)musicTone(440*Math.pow(2,[0,4,7,12][i]/12),.18,.036,'triangle',i*.10)}
 else if(kind==='bossStart'){musicTone(110,.29,.063,'sawtooth');musicTone(165,.24,.033,'sine',.13)}
 audioChannel='bgm';
}
function cue(freq=640,duration=.08,type='triangle',volume=.035){
 if(!soundOn||!ensureAudio())return;
 try{
  const now=audioContext.currentTime,o=audioContext.createOscillator(),a=audioContext.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,now);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.68),now+duration);
  a.gain.setValueAtTime(volume,now);a.gain.exponentialRampToValueAtTime(.0001,now+duration);
  o.connect(a);a.connect(seBus);o.start(now);o.stop(now+duration);
 }catch(e){}
}

function bossShotFloor(b){
 // A minimum boss DPS only for an underpowered party. More bullets or faster
 // fire divide the floor so a strong build never gets a free multiplier.
 const salvo=Math.min(12,Math.max(1,1+Math.floor(player.team/14)+Math.floor((commanderLevel()-1)/7)));
 const cadence=Math.max(.05,.14/player.rate);
 // Gear still matters even when a weak party needs the boss damage floor.
 // Better weapons and attack/speed upgrades raise its effective DPS.
 const build=Math.min(2.4,Math.sqrt(player.power*player.rate)*(1+Math.max(0,player.weapon-1)*.055+player.drone*.02));
 return b.maxHp*(b.rushPart?.0048:.0032)*build * (cadence/.14) / salvo;
}

function damage(e,value,source='rifle',showHit=true){
 if(!e || e.used || mode!=='playing')return {actual:0,crit:false};
 const crit=source!=='rifle' ? false : Math.random()<.09;
 const base=e.kind==='boss'&&source==='rifle'?Math.max(value,bossShotFloor(e)):value;
 const exposed=e.kind==='boss'&&e.weakTime>0&&source!=='counter'?1.35:1;
 const actual=(crit?base*1.65:base)*exposed*((player&&player.overdrive>0)?1.8:1);
 e.hp-=actual;e.hit=.12;
 if(e.kind==='crate')sfx('crateHit');else if(e.kind==='boss')sfx('bossHit');else sfx('hit');
 if(showHit&&source!=='counter'&&(e.kind==='mob'||e.kind==='boss')){
  // Every enemy shows its own damage. Overlapping labels are intentional.
  text((crit?'✦':'')+Math.round(actual),e.x+rnd(-.26,.26),e.kind==='boss'?5.5:1.75,e.z,crit?'#ffe47b':'#f7fbff',crit?.64:.53);
 }

  if(e.kind==='crate'){sfx('crateOpen');reward(e)}
  if(e.kind==='mob'){
   const wave=e.streamId?streamGroups[e.streamId]:null;
   let credit=!e.streamId;
   if(wave&&!wave.credited){
    wave.defeated++;
    if(wave.defeated>=Math.ceil(wave.total*.75)){
     credit=true;wave.credited=true;
    }
   }
   if(credit){sfx('kill');streak();earnEnergy(stageModifier().energy);text('⚡ +'+stageModifier().energy,e.x,rnd(1.5,2.1),e.z,'#ffe47e',.65)}
  }
  if(e.kind==='boss'){
   if(e.rushPart){
    bossHazards=bossHazards.filter(h=>h.owner!==e.rushPart);
    if(bossSiege&&bossSiege.owner===e.rushPart)bossSiege=null;
    if(warning&&warning.owner===e.rushPart)warning=null;
    boss=activeBosses()[0]||null;
    const remaining=activeBosses().length;
    if(remaining){
     announce('👑 '+remaining+' REMAIN',1.15);
     cue(920,.26,'triangle',.065);
     player.team+=1;
    }else campaignVictory();
   }else win();
  }
 }
 return {actual,crit};
}

function pickTarget(){

  const typeBias=e.kind==='crate'?2.2:(e.mobType==='runner'?1.4:e.mobType==='brute'?-0.4:0);
  const sc=e.z*.22-Math.abs(e.x-player.x)*1.8+typeBias;
  if(sc>score){score=sc;result=e}
 }

 return result;
}

function updateEnemyShots(dt){
 const mod=stageModifier();
 for(const e of entities){
  if(e.used||e.kind!=='mob'||e.z<-18||e.z>player.z-3.7)continue;
  const ranged=e.mobType==='guard'||(mod.id==='crossfire'&&e.mobType==='runner');
  if(!ranged||(e.streamId&&!e.rangedEnabled))continue;
  e.fireClock-=dt;
  if(e.fireClock<=0&&enemyShots.length<18){
   e.fireClock=Math.max(1.9,3.3*mod.shot)+rnd(0,.55);
   const targetX=clamp(player.x+rnd(-.3,.3),-3.35,3.35);
   const distance=Math.max(2,player.z-e.z),vz=11.3;
   enemyShots.push({x:e.x,y:1.18,z:e.z,vx:clamp((targetX-e.x)/distance*vz,-4.6,4.6),vz,life:4,color:e.mobType==='guard'?'magenta':'orange'});
   burst(e.x,1.25,e.z,C.magenta,5);cue(350,.035,'triangle',.014);
  }
 }
 for(const p of enemyShots){
  const oldZ=p.z;p.z+=p.vz*dt;p.x+=p.vx*dt;p.life-=dt;
  if(p.life<=0)continue;
  if(p.z>=player.z-.52 && oldZ<=player.z+.52){
   const friends=formation(),contact=friends.filter(f=>Math.abs(f.x-p.x)<.5&&Math.abs(f.z-p.z)<.7).length;
   const lost=Math.min(Math.floor(player.team),Math.min(3,contact));
   if(lost>0){

    if(player.team<1)lose();
   }
   p.life=0;
  }
 }
 enemyShots=enemyShots.filter(p=>p.life>0&&p.z<player.z+.75).slice(-24);
}

   const z=gatePanelZ(e,i);
   if(z<-28||z>player.z+1||i%2&&z<player.z-4)continue;
   const p=project(e.x,1.46,z);
   if(p&&p.y>-20&&p.y<screenH+20){
    tag('+1',p.x,p.y,'#eaffff','#167a97',p.scale*.61);
    shown++;
   }
  }
} else if(e.kind==='crate'){const p=project(e.x,2.25,e.z);if(p && p.y>-50 && p.y<screenH)tag(({weapon:'🔫',drone:'✦',heli:'🚁',turret:'🔧',team:'👥'}[e.reward]||'★')+' '+Math.ceil(Math.max(0,e.hp)),p.x,p.y,'#fff2c1','#80501e',p.scale*.85);} else if(e.kind==='mob' && !e.streamId && e.z>-34 && e.z<player.z+.5){const p=project(e.x,1.9,e.z); if(p && p.y>-40 && p.y<screenH) tag('×'+Math.ceil(e.n*clamp(e.hp/e.maxHp,0,1)),p.x,p.y,mobArchetype(e.mobType).accent[0]>.8?'#fff4d7':'#fff4f4','#6a1d2d',p.scale*.65);}}
 for(const orb of bossHazards){
  if(orb.kind!=='orb')continue;
  const p=project(orb.x,orb.y,orb.z);if(!p)continue;
  fx.save();fx.globalCompositeOperation='lighter';
  const radius=24*p.scale,g=fx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius);
  g.addColorStop(0,'rgba(255,255,255,.9)');
  g.addColorStop(.35,'rgba(255,145,92,.8)');
  g.addColorStop(1,'rgba(255,62,90,0)');
  fx.fillStyle=g;fx.beginPath();fx.arc(p.x,p.y,radius,0,TAU);fx.fill();fx.restore();
 }
 for(const eb of enemyShots){const p=project(eb.x,eb.y,eb.z);if(p){fx.save();fx.globalCompositeOperation='lighter';const radius=20*p.scale,g=fx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.35,'rgba(255,80,175,.7)');g.addColorStop(1,'rgba(255,50,110,0)');fx.fillStyle=g;fx.beginPath();fx.arc(p.x,p.y,radius,0,TAU);fx.fill();fx.restore()}}
 for(const b of bullets){const p=project(b.x,b.y,b.z); if(p){fx.save();fx.globalCompositeOperation='lighter'; const g=fx.createRadialGradient(p.x,p.y,0,p.x,p.y,18*p.scale); g.addColorStop(0,b.color==='gold'?'rgba(255,250,180,.95)':'rgba(255,255,255,.95)'); g.addColorStop(.35,b.color==='gold'?'rgba(255,201,79,.7)':'rgba(55,235,255,.7)'); g.addColorStop(1,'rgba(0,0,0,0)'); fx.fillStyle=g; fx.beginPath(); fx.arc(p.x,p.y,18*p.scale,0,TAU); fx.fill(); fx.restore(); }}
 for(const tt of texts){const p=project(tt.x,tt.y,tt.z);if(p){fx.save();fx.globalAlpha=clamp(tt.life/tt.max,0,1);fx.textAlign='center';fx.font=`1000 ${tt.msg.includes('✦')?23:19}px system-ui`;fx.lineWidth=4;fx.strokeStyle='#071321';fx.strokeText(tt.msg,p.x,p.y);fx.fillStyle=tt.color;fx.fillText(tt.msg,p.x,p.y);fx.restore()}}
}
function tag(value,x,y,color,bg,scale){
 const sz=clamp(18*scale,12,30);fx.save();fx.font=`900 ${sz}px system-ui`;fx.textAlign='center';const w=fx.measureText(value).width+14,h=sz+10;
 fx.fillStyle=bg;fx.strokeStyle=color;fx.lineWidth=1.4;fx.beginPath();fx.roundRect(x-w/2,y-h/2,w,h,6);fx.fill();fx.stroke();fx.fillStyle=color;fx.fillText(value,x,y+sz*.34);fx.restore();
}

function updateHUD(){
 if(!player)return;
 $('team-val').textContent=String(Math.max(0,Math.floor(player.team)));
 $('weapon-val').textContent=String(player.weapon);
 $('progress-fill').style.width=(Math.min(1,t/29)*100)+'%';
 $('boss-hud').style.display=boss&&!boss.used?'block':'none';
 $('combo-val').textContent=combo+'×';$('combo-hud').classList.toggle('show',combo>=2&&comboTime>0);
 $('support-hud').innerHTML=(player.overdrive>0?'🌟'+Math.ceil(player.overdrive)+'s<br>':'')+'💪'+commanderLevel()+'　✦'+player.drone+' 🚁'+player.heli+' 🔧'+player.turret;
 const rule=stageModifier();$('stage-rule').textContent=fever?'🔥':rule.name.split(' ')[0];$('stage-rule').title=fever?'FEVER · '+rule.name:rule.name+' · '+rule.info;
 const thresholds=fieldThresholdsForStage(),prev=fieldPicks>0?thresholds[fieldPicks-1]:0,next=thresholds[fieldPicks];
 $('field-xp-fill').style.width=(next===undefined?100:clamp((fieldCharge-prev)/(next-prev),0,1)*100)+'%';
 $('field-xp').setAttribute('aria-valuemin',String(prev));
 $('field-xp').setAttribute('aria-valuemax',String(next===undefined?prev:next));
 $('field-xp').setAttribute('aria-valuenow',String(Math.min(fieldCharge,next===undefined?fieldCharge:next)));
 const pips=$('field-xp-pips').children;
 for(let i=0;i<pips.length;i++){
  pips[i].style.display=i<thresholds.length?'block':'none';
  pips[i].classList.toggle('on',i<fieldPicks);
 }
 impactFlash.style.opacity=flashTime>0?'1':'0';
 if(boss&&!boss.used){
  const alive=activeBosses(),aggregate=rushStarted&&alive.length;
  const hp=aggregate?alive.reduce((v,b)=>v+b.hp,0):boss.hp;
  const maximum=aggregate?rushBosses.reduce((v,b)=>v+b.maxHp,0):boss.maxHp;
  $('boss-fill').style.width=(clamp(hp/maximum,0,1)*100)+'%';
  $('phase-val').textContent=bossSiege?'☄':boss.weakTime>0?'⚡':['I','II','III'][boss.phase-1];
  $('boss-name').textContent=aggregate?'👑 BOSS RUSH · '+alive.length+'体':boss.name;
 }
}
function frame(ts){const dt=Math.min(.04,(ts-(last||ts))/1000);last=ts;walk+=dt*.4;update(dt);render();updateHUD();requestAnimationFrame(frame)}
function pointerX(e){const r=glCanvas.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width*2-1,-1,1)}
function setTouch(e){if(player)player.tx=clamp(pointerX(e)*3.55,-3.55,3.55)}
for(const canvas of [glCanvas,fxCanvas]){
 canvas.addEventListener('pointerdown',e=>{if(mode!=='playing')return;drag=e.pointerId;setTouch(e);try{canvas.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
 canvas.addEventListener('pointermove',e=>{if(mode==='playing'&&drag===e.pointerId){setTouch(e);e.preventDefault()}});
 for(const event of ['pointerup','pointercancel'])canvas.addEventListener(event,e=>{if(drag===e.pointerId)drag=null});
}
document.addEventListener('keydown',e=>{if(!player)return;if(e.key==='ArrowLeft'||e.key==='a')player.tx=clamp(player.tx-.65,-3.55,3.55);if(e.key==='ArrowRight'||e.key==='d')player.tx=clamp(player.tx+.65,-3.55,3.55);if(e.key===' '&&mode==='playing')togglePause()});
function togglePause(){if(mode==='playing'){mode='paused';show(`<div class="eyebrow">Ⅱ</div><h1>PAUSE</h1><button class="cta" id="resume">▶ RESUME</button>`);$('resume').onclick=togglePause;$('pause').textContent='▶'}else if(mode==='paused'){mode='playing';overlay.classList.add('off');$('pause').textContent='Ⅱ'}}
$('pause').onclick=togglePause;
$('audio').onclick=openSoundSettings;
$('settings-close').onclick=closeSoundSettings;
$('settings-mute').onclick=()=>{
 soundOn=!soundOn;saveSoundSettings();
 if(soundOn){ensureAudio();musicClock=0;cue(880,.13)}
 else applyAudioVolumes();
 syncSoundControls();
};
$('settings-preview').onclick=()=>{
 if(!soundOn){soundOn=true;saveSoundSettings()}
 ensureAudio();syncSoundControls();
 if(audioContext){
  if(audioContext.state==='running'){
   audioChannel='bgm';musicTone(440,.20,.08,'triangle');musicTone(660,.24,.08,'triangle',.17);
   audioChannel='se';musicTone(880,.12,.065,'triangle',.40);audioChannel='bgm';
  }else audioContext.resume().then(()=>{if(soundOn)cue(880,.22,'triangle',.07)}).catch(()=>{});
 }
};
for(const name of ['master','bgm','se']){
 const input=$('volume-'+name);
 input.addEventListener('input',()=>{
  const v=clamp(Number(input.value)/100,0,1);
  if(name==='master')masterVolume=v;
  if(name==='bgm')bgmVolume=v;
  if(name==='se')seVolume=v;
  $('volume-'+name+'-label').textContent=Math.round(v*100)+'%';
  applyAudioVolumes();saveSoundSettings();
  if(soundOn&&name!=='bgm'&&(previewClock<0||t-previewClock>.18)){
   previewClock=t;cue(770,.09,'triangle',.04);
  }
 });
}
syncSoundControls();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')togglePause()});
$('audio').classList.add('on');
// backdrop actors on menu, real gameplay starts only from Start
player={x:0,tx:0,z:5.3,team:26,weapon:3,drone:1,heli:1,turret:1,power:1,rate:1,armor:0};
entities=[{kind:'gate',x:2.2,z:-19,y:0,length:8.5,gain:28,taken:0,used:false},{kind:'crate',x:-2.2,z:-13,hp:82,maxHp:82,reward:'heli',hit:0,used:false},{kind:'mob',mobType:'runner',x:-1.0,z:-23,hp:120,maxHp:120,n:18,seed:2,used:false,hit:0,scale:.29},{kind:'mob',mobType:'brute',x:1.4,z:-28,hp:160,maxHp:160,n:12,seed:5,used:false,hit:0,scale:.42}];
boss={kind:'boss',bossType:'beetle',name:'STORM BEETLE',x:0,z:-39,hp:4700,maxHp:4700,phase:1,hit:0,used:false,entered:false};
menu();requestAnimationFrame(frame);
})();
