<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9eafd;color:#eef8ff}

canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{pointer-events:none;z-index:2}
#hud{position:absolute;z-index:3;inset:0;pointer-events:none;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.top{display:flex;align-items:start;gap:7px;margin-top:9px}
.pill{background:linear-gradient(160deg,rgba(9,34,53,.94),rgba(5,20,34,.82));border:1px solid rgba(129,213,255,.28);box-shadow:inset 0 1px rgba(255,255,255,.15),0 5px 18px #00132366;border-radius:11px;padding:7px 9px;min-width:0;white-space:nowrap}

#pause,#audio{pointer-events:auto;border:1px solid #86d9ff7a;background:#09283fdb;color:#fff;border-radius:11px;width:37px;height:40px;font-weight:900;font-size:18px;flex-shrink:0;box-shadow:inset 0 1px #ffffff22,0 4px 16px #0006}

.upgrades{display:grid;gap:9px;margin:16px 0}.upgrade{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 12px;border:1px solid #84ddff83;border-radius:13px;color:#f0fbff;background:linear-gradient(115deg,#1c4961,#123047);font:inherit;cursor:pointer}.upgrade:active{transform:scale(.98)}.upgrade .emoji{font-size:29px;width:39px;text-align:center}.upgrade b{font-size:14px;display:block}.upgrade small{font-size:11px;color:#b9d6e7;display:block;margin-top:3px}
#progress{margin:7px auto 0;width:min(74%,360px);height:5px;background:#09283ed9;border-radius:6px;overflow:hidden;border:1px solid #74e8ff5b}

#boss-hud{display:none;position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 103px);transform:translateX(-50%);width:min(80%,440px);padding:8px 12px 9px;border-radius:12px;border:1px solid #ffadb899;background:linear-gradient(#391725f0,#220f1ce8);box-shadow:0 0 20px #ff45632c;text-align:center}

#notice{position:absolute;top:calc(env(safe-area-inset-top) + 222px);left:0;right:0;text-align:center;color:#fff;font-weight:1000;font-size:22px;text-shadow:0 3px 9px #000,0 0 14px #000;opacity:0;transition:opacity .17s;pointer-events:none}
#bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 13px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;gap:8px}
#bottom .signature{font-size:10px;color:#c6ebffb0;font-weight:900;text-shadow:0 1px 6px #000}
#bottom .hint{font-size:10px;color:#dcfaffcc;text-align:right;text-shadow:0 1px 6px #000}
#overlay{position:absolute;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#07131fc9,#05111eee);padding:22px;backdrop-filter:blur(3px)}
#overlay.off{display:none}
.panel{width:min(92vw,400px);text-align:center;border:1px solid #75ccff47;border-radius:22px;background:linear-gradient(160deg,#0c3048f5,#071a2cf5);box-shadow:0 20px 70px #0009,inset 0 1px #ffffff17;padding:22px 18px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:#91edff;font-weight:950}
h1{font-size:clamp(35px,10vw,50px);line-height:1;letter-spacing:-.035em;margin:10px 0;color:#fff;text-shadow:0 5px 17px #0008}
h1 em{font-style:normal;color:#ffcf65}
p{font-size:13px;color:#c4dce9;line-height:1.8;margin:16px 0}
.cta{width:100%;border:0;border-radius:13px;padding:15px 12px;background:linear-gradient(120deg,#9cffe3,#45c2f2);color:#062b3c;font-size:16px;font-weight:1000;box-shadow:0 5px 0 #188da4,0 12px 25px #0005}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #188da4}
.mini{font-size:11px;line-height:1.7;color:#89b5ce;margin-top:15px}
#combo-hud{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 189px);transform:translateX(-50%) scale(.9);padding:5px 14px 8px;border:1px solid #ffce6caa;border-radius:14px;background:linear-gradient(145deg,#53351bea,#20162bf2);box-shadow:0 3px 25px #ffbd453b;text-align:center;opacity:0;transition:opacity .12s,transform .12s;min-width:130px}

.victory{position:absolute;inset:0;pointer-events:none;overflow:hidden}.victory i{position:absolute;top:-10%;left:var(--x);width:8px;height:15px;border-radius:2px;background:var(--c);animation:confetti var(--d) linear infinite;animation-delay:var(--delay);transform:rotate(var(--r))}
@keyframes confetti{to{transform:translate3d(var(--s),110vh,0) rotate(740deg);opacity:.1}}

/* Compact sound mixer with touch-friendly native sliders. */
#settings-overlay{position:absolute;z-index:7;inset:0;display:flex;align-items:center;justify-content:center;background:#061522dd;backdrop-filter:blur(4px);padding:20px;touch-action:auto;pointer-events:auto}

.settings-panel{width:min(94vw,390px);max-height:calc(100dvh - 42px);overflow:auto;padding:20px 18px;border-radius:20px;border:1px solid #86dcff66;background:linear-gradient(150deg,#133b54,#071b30);box-shadow:0 15px 55px #000b;text-align:center}

/* Five-stage campaign map, shown between stages and at the finale. */

.panel{max-height:calc(100dvh - 38px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}

</style>

<body>
<main id="game">
 <canvas id="glcanvas" aria-label="3Dのゲートシューティングゲーム"></canvas>
 <canvas id="labels"></canvas>
 <div id="hud">
  <div class="top">
   <div id="stage" class="pill" aria-label="ステージ"><div class="big" id="stage-val">01</div></div>
   <div class="pill" aria-label="人数"><span class="small" aria-hidden="true">👥</span><div class="big cyan" id="team-val">13</div></div>
   <div class="pill" aria-label="武器レベル"><span class="small" aria-hidden="true">🔫</span><div class="big gold" id="weapon-val">1</div></div>
   <div class="pill" aria-label="HP"><span class="small" aria-hidden="true">❤️</span><div class="big" id="hp-val">100</div></div>
   <button id="audio" aria-label="音楽と効果音をオフにする">♫</button><button id="pause" aria-label="一時停止">Ⅱ</button>
  </div>
  <div id="progress"><div id="progress-fill"></div></div>
  <div id="field-xp" role="progressbar" aria-label="撃破エネルギー" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><div id="field-xp-fill"></div></div>
  <div id="field-xp-pips" aria-label="獲得したフィールド強化"><i></i><i></i><i></i></div>
  <div id="stage-rule" title="ステージルール">⚔</div>
  <div id="boss-hud"><div class="title"><span id="boss-name">BOSS</span><span id="phase-val">I</span></div><div id="boss-fill-bg"><div id="boss-fill"></div></div></div>
  <div id="combo-hud"><b id="combo-val">0×</b></div>
  <div id="support-hud">🚁0 🔧0</div>
  <div id="notice"></div>
 </div>
 <div id="settings-overlay" class="off" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="settings-panel">
   <div class="eyebrow">SOUND</div><h2 id="settings-title">♫ 音量設定</h2>
   <div class="volume-row"><label for="volume-master">🔊 全体</label><output id="volume-master-label">100%</output><input id="volume-master" type="range" min="0" max="100" step="1" value="100"></div>
   <div class="volume-row"><label for="volume-bgm">♫ BGM</label><output id="volume-bgm-label">100%</output><input id="volume-bgm" type="range" min="0" max="100" step="1" value="100"></div>
   <div class="volume-row"><label for="volume-se">✦ SE</label><output id="volume-se-label">100%</output><input id="volume-se" type="range" min="0" max="100" step="1" value="100"></div>
   <div class="sound-actions"><button id="settings-mute" type="button">🔊 ON</button><button id="settings-preview" type="button">♫ / ✦ 試聴</button></div>
   <button id="settings-close" class="cta" type="button">✓ 戻る</button>
   <p class="settings-foot">音量は自動保存されます</p>
  </div>
 </div>
 <div id="impact-flash"></div>
 <div id="boss-intro"><span>⚠ BOSS</span><b>MEGA TITAN</b></div>
 <div id="overlay"><div class="panel" id="panel"></div></div>
 <div id="fail"><div><h1>WebGL 2 が使えません</h1><p>Safariの最新版で開き直すか、WebGL対応ブラウザをお試しください。</p></div></div>
</main>
<script>
(()=>{
'use strict';
const glCanvas=document.getElementById('glcanvas');
const fxCanvas=document.getElementById('labels');
const fx=fxCanvas.getContext('2d');
const overlay=document.getElementById('overlay');
const panel=document.getElementById('panel');
const notice=document.getElementById('notice');
const impactFlash=document.getElementById('impact-flash');
const bossIntro=document.getElementById('boss-intro');
const $=id=>document.getElementById(id);
const gl=glCanvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
if(!gl){$('fail').style.display='grid';overlay.classList.add('off');return}
const PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rnd=(a,b)=>a+(b-a)*Math.random();

const C={
 concrete:[.60,.66,.72,1],concreteTop:[.73,.78,.82,1],seam:[.47,.56,.63,1],
 blue:[.12,.48,.92,1],blueLight:[.39,.82,1,1],blueDark:[.07,.21,.52,1],
 skin:[.97,.72,.58,1],helmet:[.07,.30,.58,1],gun:[.12,.17,.22,1],
 red:[.87,.23,.23,1],redLight:[1,.53,.32,1],redDark:[.41,.07,.15,1],
 zombie:[.80,.63,.60,1],pants:[.25,.15,.21,1],
 gold:[1,.72,.25,1],wood:[.58,.38,.20,1],woodTop:[.83,.59,.34,1],
 boss:[.78,.48,.44,1],bossLight:[.94,.69,.61,1],bossDark:[.43,.22,.24,1],
 eye:[1,.14,.16,1],shadow:[.16,.23,.32,1],water:[.045,.28,.41,1],
 white:[.90,.98,1,1],cyan:[.22,1,.90,1],heli:[.18,.72,.79,1],heliDark:[.06,.25,.36,1],rocket:[1,.48,.16,1],spark:[1,.95,.44,1],
 allyGlow:[.80,.98,1,1],allyGold:[1,.82,.35,1],magenta:[.94,.32,.75,1],orange:[1,.58,.24,1],lime:[.62,.96,.29,1],violet:[.62,.52,1,1],teal:[.18,.92,.83,1],armor:[.72,.85,.95,1],armorHi:[.91,.97,1,1],sand:[.96,.84,.60,1],glass:[.20,.55,.78,1],warn:[1,.76,.20,1]
};

function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const vert=`#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNormal;
layout(location=2) in vec4 iM0;
layout(location=3) in vec4 iM1;
layout(location=4) in vec4 iM2;
layout(location=5) in vec4 iM3;
layout(location=6) in vec4 iColor;
uniform mat4 uVP;
uniform vec3 uCam;
out vec3 vN;
out vec4 vColor;
out float vDist;
out vec3 vWorld;
void main(){
 mat4 model=mat4(iM0,iM1,iM2,iM3);
 vec4 wp=model*vec4(aPos,1.0);
 gl_Position=uVP*wp;
 vN=normalize(mat3(model)*aNormal);
 vColor=iColor;
 vDist=length(uCam-wp.xyz);
 vWorld=wp.xyz;
}`;
const frag=`#version 300 es
precision highp float;
in vec3 vN;
in vec4 vColor;
in float vDist;
in vec3 vWorld;
uniform vec3 uFogColor;
out vec4 outColor;
void main(){
 vec3 n=normalize(vN);
 vec3 sun=normalize(vec3(-0.50,0.86,0.34));
 float lit=max(dot(n,sun),0.0);
 float sky=0.64+0.07*max(n.y,0.0);
 float rim=pow(1.0-max(dot(n,normalize(vec3(0.1,0.6,0.8))),0.0),3.0);
 vec3 col=vColor.rgb*(sky+0.39*lit);
 col+=vec3(0.08,0.13,0.17)*lit*rim;
 col+=vColor.rgb*pow(max(dot(n,normalize(vec3(-0.15,0.78,0.62))),0.0),18.0)*0.13;
 float fog=clamp((vDist-20.0)/55.0,0.0,0.69);
 col=mix(col,uFogColor,fog);
 col=pow(max(col,vec3(0.0)),vec3(.94));
 outColor=vec4(col,1.0);
}`;
const program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,vert));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,frag));gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS)){throw Error(gl.getProgramInfoLog(program))}
gl.useProgram(program);
const uVP=gl.getUniformLocation(program,'uVP');
const uCam=gl.getUniformLocation(program,'uCam');
const uFogColor=gl.getUniformLocation(program,'uFogColor');
gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);
gl.clearColor(.045,.26,.38,1);

function cubeMesh(){
 const faces=[

function bossShotFloor(b){

 // fire divide the floor so a strong build never gets a free multiplier.

}

 for(let i=0;i<pips.length;i++)pips[i].classList.toggle('on',i<fieldPicks);
 impactFlash.style.opacity=flashTime>0?'1':'0';
 if(boss&&!boss.used){$('boss-fill').style.width=(clamp(boss.hp/boss.maxHp,0,1)*100)+'%';$('phase-val').textContent=bossSiege?'☄':boss.weakTime>0?'⚡':['I','II','III'][boss.phase-1];$('boss-name').textContent=(boss.rushPart?'👑 '+rushIndex+'/'+bossRushList().length+' ':'')+boss.name}
}
function frame(ts){const dt=Math.min(.04,(ts-(last||ts))/1000);last=ts;walk+=dt*.4;update(dt);render();updateHUD();requestAnimationFrame(frame)}
function pointerX(e){const r=glCanvas.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width*2-1,-1,1)}
function setTouch(e){if(player)player.tx=clamp(pointerX(e)*3.55,-3.55,3.55)}
for(const canvas of [glCanvas,fxCanvas]){
 canvas.addEventListener('pointerdown',e=>{if(mode!=='playing')return;drag=e.pointerId;setTouch(e);try{canvas.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
 canvas.addEventListener('pointermove',e=>{if(mode==='playing'&&drag===e.pointerId){setTouch(e);e.preventDefault()}});
 for(const event of ['pointerup','pointercancel'])canvas.addEventListener(event,e=>{if(drag===e.pointerId)drag=null});
}
document.addEventListener('keydown',e=>{if(!player)return;if(e.key==='ArrowLeft'||e.key==='a')player.tx=clamp(player.tx-.65,-3.55,3.55);if(e.key==='ArrowRight'||e.key==='d')player.tx=clamp(player.tx+.65,-3.55,3.55);if(e.key===' '&&mode==='playing')togglePause()});
function togglePause(){if(mode==='playing'){mode='paused';show(`<div class="eyebrow">Ⅱ</div><h1>PAUSE</h1><button class="cta" id="resume">▶ RESUME</button>`);$('resume').onclick=togglePause;$('pause').textContent='▶'}else if(mode==='paused'){mode='playing';overlay.classList.add('off');$('pause').textContent='Ⅱ'}}
$('pause').onclick=togglePause;
$('audio').onclick=openSoundSettings;
$('settings-close').onclick=closeSoundSettings;
$('settings-mute').onclick=()=>{
 soundOn=!soundOn;saveSoundSettings();
 if(soundOn){ensureAudio();musicClock=0;cue(880,.13)}
 else applyAudioVolumes();
 syncSoundControls();
};
$('settings-preview').onclick=()=>{
 if(!soundOn){soundOn=true;saveSoundSettings()}
 ensureAudio();syncSoundControls();
 if(audioContext){
  if(audioContext.state==='running'){
   audioChannel='bgm';musicTone(440,.20,.08,'triangle');musicTone(660,.24,.08,'triangle',.17);
   audioChannel='se';musicTone(880,.12,.065,'triangle',.40);audioChannel='bgm';
  }else audioContext.resume().then(()=>{if(soundOn)cue(880,.22,'triangle',.07)}).catch(()=>{});
 }
};
for(const name of ['master','bgm','se']){
 const input=$('volume-'+name);
 input.addEventListener('input',()=>{
  const v=clamp(Number(input.value)/100,0,1);
  if(name==='master')masterVolume=v;
  if(name==='bgm')bgmVolume=v;
  if(name==='se')seVolume=v;
  $('volume-'+name+'-label').textContent=Math.round(v*100)+'%';
  applyAudioVolumes();saveSoundSettings();
  if(soundOn&&name!=='bgm'&&(previewClock<0||t-previewClock>.18)){
   previewClock=t;cue(770,.09,'triangle',.04);
  }
 });
}
syncSoundControls();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')togglePause()});
$('audio').classList.add('on');
// backdrop actors on menu, real gameplay starts only from Start
player={x:0,tx:0,z:5.3,team:26,weapon:3,drone:1,heli:1,turret:1,hp:100,maxHp:100,power:1,rate:1,armor:0};
entities=[{kind:'gate',x:2.2,z:-19,y:0,length:8.5,gain:28,taken:0,used:false},{kind:'crate',x:-2.2,z:-13,hp:82,maxHp:82,reward:'heli',hit:0,used:false},{kind:'mob',mobType:'runner',x:-1.0,z:-23,hp:120,maxHp:120,n:18,seed:2,used:false,hit:0,scale:.29},{kind:'mob',mobType:'brute',x:1.4,z:-28,hp:160,maxHp:160,n:12,seed:5,used:false,hit:0,scale:.42}];
boss={kind:'boss',bossType:'beetle',name:'STORM BEETLE',x:0,z:-39,hp:4700,maxHp:4700,phase:1,hit:0,used:false,entered:false};
menu();requestAnimationFrame(frame);
})();
</script>
