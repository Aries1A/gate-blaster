<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a2540">
<title>GATE BLASTER · SWARM v2.1</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#071521;color:#f4fbff;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100vw;height:100dvh;background:#071521;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(4,10,18,.55),rgba(4,10,18,.82));padding:18px;z-index:5}
#overlay.off{display:none}
.panel{width:min(92vw,430px);background:rgba(5,19,31,.88);backdrop-filter:blur(10px);border:1px solid rgba(127,216,255,.22);border-radius:18px;padding:20px 18px;box-shadow:0 12px 40px rgba(0,0,0,.35);text-align:center}
.eyebrow{font-size:11px;letter-spacing:.18em;color:#80f4ff;font-weight:900}
h1{margin:10px 0 8px;font-size:clamp(30px,8vw,44px);line-height:1.02;font-weight:950;letter-spacing:.04em}
h1 em{font-style:normal;color:#ffd367}
p{font-size:13px;line-height:1.75;color:#c1d8e8;margin:12px 0}
button{border:0;border-radius:14px;padding:14px 16px;font:inherit;font-weight:900;cursor:pointer}
.cta{width:100%;background:linear-gradient(135deg,#8fffe6,#46b9ff);color:#06253a}
.row{display:flex;gap:10px;margin-top:12px}.row button{flex:1}
.ghost{background:#0e283b;color:#d7efff;border:1px solid rgba(127,216,255,.18)}
.mini{margin-top:12px;font-size:11px;line-height:1.7;color:#9ab7ca}
#rotate{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(8,24,40,.7);font-size:12px;color:#b8d8e9;z-index:3;border:1px solid rgba(255,255,255,.08)}
#rotate.hidden{display:none}
</style>
</head>
<body>
<main id="game" aria-label="ゲートブラスター">
  <canvas id="cv"></canvas>
  <div id="rotate">横向きだと遊びやすいよ</div>
  <div id="overlay"><div class="panel" id="panel"></div></div>
</main>
<script>
(() => {
'use strict';
const cv=document.getElementById('cv');
const g=cv.getContext('2d');
const overlay=document.getElementById('overlay');
const panel=document.getElementById('panel');
const rotateHint=document.getElementById('rotate');
const DPR=Math.min(devicePixelRatio||1,2);
let W=420,H=760;
let roadWidth=400;
let mode='menu',level=1,best=1,last=0,elapsed=0;
let pointer=null;
const road={bottomPad:100};
const laneCenter=idx=>W/2+(idx-1.5)*roadWidth*.23;
const sideX=side=>W/2+(side==='left'?-1:1)*roadWidth*.32;
const projectX=(x,sy)=>W/2+(x-W/2)*(.57+.43*clamp(sy/H,0,1));
const projectScale=sy=>.59+.41*clamp(sy/H,0,1);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const pick=a=>a[(Math.random()*a.length)|0];
try{best=Number(localStorage.getItem('gate-blaster-sw-best'))||1}catch(e){}

let state;
function defaultState(){
  return {
    player:{x:W/2,targetX:W/2,y:0,team:13,startTeam:13,weapon:1,drones:0,hp:100,maxHp:100,power:1},
    bullets:[],texts:[],particles:[],entities:[],timeline:[],boss:null,
    progress:0,stageLength:24,cameraSpeed:165,spawnIndex:0,
    coins:9.4,gems:5.7,energy:6.5,
    stageCleared:false,gameOver:false
  };
}

function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  cv.width=Math.round(w*DPR);
  cv.height=Math.round(h*DPR);
  cv.style.width=w+'px';
  cv.style.height=h+'px';
  H=760;W=H*w/h;
  roadWidth=Math.min(W*.94,970);
  g.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  if(state){
    state.player.x=clamp(state.player.x,W/2-roadWidth*.39,W/2+roadWidth*.39);
    state.player.targetX=clamp(state.player.targetX,W/2-roadWidth*.39,W/2+roadWidth*.39);
  }
  rotateHint.classList.add('hidden');
}
window.addEventListener('resize',resize,{passive:true});
resize();

function show(html){panel.innerHTML=html;overlay.classList.remove('off')}
function hide(){overlay.classList.add('off')}

function menu(){
  mode='menu';
  show(`<div class="eyebrow">SWARM v2.1 · 13人スタート</div>
  <h1>GATE <em>BLASTER</em></h1>
  <p>今度は、画像みたいな <b>大群ランナー寄り</b> に作り直した版。<br>
  開始直後から敵が襲来。左右にスライドして <b>+1 階段</b> や <b>武器コンテナ</b> を取り、
  赤い敵の群れを突破して最後にボスを倒そう。</p>
  <button class="cta" id="start">▶ スタート</button>
  <div class="mini">最高到達ステージ: ${best}<br>操作: 指で左右にドラッグ / 射撃は自動</div>`);
  document.getElementById('start').onclick=startGame;
}

function startGame(){
  state=defaultState();
  buildStage();
  elapsed=0;
  mode='playing';
  hide();
}

function buildStage(){
  state.entities=[];
  state.timeline=[];
  state.spawnIndex=0;
  state.progress=0;
  state.stageLength=24+Math.min(level*1.2,8);
  const dense=15+level*2;
  const crowdHp=55+level*20;
  const bossHp=340+level*110;
  const crateHp=62+level*12;
  // (time, type, options)
  state.timeline.push(
    {t:1.0,type:'crowd',lane:1,hp:crowdHp-25,width:130,height:90,loss:7+level*2},
    {t:2.0,type:'stairs',side:'right',gain:12+dense/2,length:3.5},
    {t:2.2,type:'crate',side:'left',hp:crateHp,reward:'weapon'},
    {t:5.1,type:'crowd',lane:2,hp:crowdHp,width:158,height:104,loss:10+level*2},
    {t:8.5,type:'stairs',side:'left',gain:14+dense/2,length:3.7},
    {t:8.6,type:'crate',side:'right',hp:crateHp+24,reward:'drone'},
    {t:12.1,type:'crowd',lane:1,hp:crowdHp+25,width:165,height:110,loss:12+level*2},
    {t:15.5,type:'stairs',side:Math.random()>.5?'right':'left',gain:16+dense/2,length:3.8},
    {t:17.0,type:'crate',side:Math.random()>.5?'left':'right',hp:crateHp+35,reward:Math.random()>.5?'weapon':'team'},
    {t:19.0,type:'crowd',lane:2,hp:crowdHp+40,width:180,height:120,loss:15+level*2},
    {t:21.0,type:'boss',hp:bossHp}
  );
}

function screenY(worldY){
  const visible=H+220;
  return H-road.bottomPad-(worldY-state.progress);
}


function spawnEvent(ev){
  if(ev.type==='stairs'){
    const x=sideX(ev.side);
    state.entities.push({type:'stairs',x,y:state.progress+H+180,w:roadWidth*.29,h:ev.length*130,gainRate:ev.gain/ev.length,taken:0,side:ev.side});
  }else if(ev.type==='crate'){
    const x=sideX(ev.side);
    state.entities.push({type:'crate',x,y:state.progress+H+150,w:roadWidth*.28,h:95,hp:ev.hp,maxHp:ev.hp,reward:ev.reward,hitFlash:0});
  }else if(ev.type==='crowd'){
    state.entities.push({type:'crowd',x:laneCenter(ev.lane),y:state.progress+H+160,w:Math.min(ev.width,roadWidth*.38),h:ev.height,hp:ev.hp,maxHp:ev.hp,loss:ev.loss,hitFlash:0,breached:false});
  }else if(ev.type==='boss'){
    state.boss={type:'boss',x:W*0.5,y:state.progress+H+260,w:190,h:210,hp:ev.hp,maxHp:ev.hp,hitFlash:0,attackCooldown:3.3,entered:false};
  }
}

function addText(txt,x,y,color='#fff',life=1,size=24){state.texts.push({txt,x,y,color,life,max:life,size})}
function burst(x,y,color,count=12,speed=130){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=rand(speed*.35,speed);
    state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.35,.85),max:1,color,r:rand(2,5)});
  }
}

function reward(kind){
  const p=state.player;
  if(kind==='weapon'){p.weapon=Math.min(9,p.weapon+1);addText('武器UP',p.x,H-190,'#81dcff',1.2,30)}
  else if(kind==='drone'){p.drones=Math.min(4,p.drones+1);addText('支援機 +1',p.x,H-190,'#9bf0ff',1.2,30)}
  else if(kind==='team'){p.team+=12;addText('+12',p.x,H-190,'#8bffd1',1.2,32)}
  burst(p.x,H-170,'#9af6ff',18,160);
}

function lose(){
  if(mode!=='playing')return;
  mode='lost';
  state.gameOver=true;
  show(`<div class="eyebrow">MISSION FAILED</div><h1>GAME <em>OVER</em></h1>
  <p>敵の群れかボスを突破できなかった！<br>人数を増やしつつコンテナも壊して、火力を上げよう。</p>
  <div class="row"><button class="cta" id="retry">↻ もう一回</button><button class="ghost" id="menuBtn">メニュー</button></div>
  <div class="mini">到達ステージ: ${level}<br>最高到達ステージ: ${best}</div>`);
  document.getElementById('retry').onclick=()=>{level=1;startGame()};
  document.getElementById('menuBtn').onclick=menu;
}

function win(){
  if(mode!=='playing')return;
  mode='won';
  best=Math.max(best,level+1);
  try{localStorage.setItem('gate-blaster-sw-best',String(best))}catch(e){}
  show(`<div class="eyebrow">MISSION COMPLETE</div><h1>BOSS <em>DEFEATED!</em></h1>
  <p>かなり画像の雰囲気に寄せた版になったと思う。<br>次のステージでは敵とボスがさらに固くなるよ。</p>
  <div class="row"><button class="cta" id="next">次のステージ</button><button class="ghost" id="menuBtn">メニュー</button></div>
  <div class="mini">部隊人数: ${Math.max(0,Math.floor(state.player.team))} / 武器LV: ${state.player.weapon} / 支援機: ${state.player.drones}</div>`);
  document.getElementById('next').onclick=()=>{level++;startGame()};
  document.getElementById('menuBtn').onclick=menu;
}

function applyDamage(target,dmg){
  if(target.dead || mode!=='playing')return;
  target.hp-=dmg;
  target.hitFlash=.08;
  if(target.hp<=0){
    if(target.type==='crate'){reward(target.reward);target.dead=true;burst(target.x,screenY(target.y),'#9defff',20,180)}
    if(target.type==='crowd'){target.dead=true;burst(target.x,screenY(target.y),'#ff9aa3',30,150);addText('突破!',target.x,screenY(target.y)-10,'#ffd2d2',1,28)}
    if(target.type==='boss'){target.dead=true;burst(target.x,screenY(target.y),'#ffbecc',55,230);win()}
  }
}

function findTarget(){
  const p=state.player;
  const candidates=[];
  for(const e of state.entities){
    if(e.dead)continue;
    const sy=screenY(e.y);
    if(sy<45||sy>H-115)continue;
    const dx=Math.abs(projectX(e.x,sy)-p.x);
    if(dx>roadWidth*.23)continue;
    let priority=0;
    if(e.type==='crate')priority=60;
    if(e.type==='crowd')priority=40;
    const score=priority + (H-sy)*0.08 - dx*0.18;
    candidates.push({t:e,score});
  }
  if(state.boss && !state.boss.dead){
    const sy=screenY(state.boss.y);
    if(sy>30 && sy<H-105)candidates.push({t:state.boss,score:55+(H-sy)*0.06-Math.abs(projectX(state.boss.x,sy)-p.x)*0.1});
  }
  candidates.sort((a,b)=>b.score-a.score);
  return candidates[0]?.t||null;
}

function fire(dt){
  const p=state.player;
  const target=findTarget();
  if(!target)return;
  const sy=screenY(target.y);
  const guns=Math.max(1,Math.floor(p.team/18));
  const dmgPerSec=(9 + p.team*0.31 + p.weapon*9 + p.drones*6) * p.power;
  applyDamage(target,dmgPerSec*dt);
  for(let i=0;i<Math.min(7,guns);i++){
    state.bullets.push({x:p.x+rand(-42,42),y:H-142-rand(0,16),tx:projectX(target.x,sy)+rand(-20,20),ty:sy+rand(-18,18),life:.08,max:.08,color:'#88fff0'});
  }
  for(let i=0;i<p.drones;i++){
    const ang=performance.now()/340 + i*(Math.PI*2/Math.max(1,p.drones));
    const dx=Math.cos(ang)*74;
    state.bullets.push({x:p.x+dx,y:H-190+Math.sin(ang)*14,tx:projectX(target.x,sy)+rand(-10,10),ty:sy+rand(-14,14),life:.1,max:.1,color:'#a8d8ff'});
    applyDamage(target,dt*(4+p.weapon));
  }
}

function update(dt){
  if(mode!=='playing')return;
  elapsed+=dt;
  state.progress+=state.cameraSpeed*dt;
  while(state.spawnIndex<state.timeline.length && state.timeline[state.spawnIndex].t<=elapsed){spawnEvent(state.timeline[state.spawnIndex++])}
  const p=state.player;
  p.x += (p.targetX-p.x)*Math.min(1,dt*11);

  for(const e of state.entities){
    const sy=screenY(e.y);
    if(e.type==='stairs' && !e.dead){
      const overlapY=Math.abs(sy-(H-175)) < (e.h*0.5+52);
      const overlapX=Math.abs(p.x-projectX(e.x,sy)) < e.w*.42+21;
      if(overlapY && overlapX){
        const gain=e.gainRate*dt*1.8;
        p.team+=gain;
        e.taken += gain;
        if((Math.floor(e.taken*2)%2)===0 && Math.random()<0.18){addText('+1',p.x+rand(-45,45),H-200-rand(0,35),'#9ffff3',.7,24)}
      }
      if(sy<-e.h) e.dead=true;
    }
    if(e.type==='crowd' && !e.dead){
      if(!e.breached && sy>H-190 && Math.abs(p.x-e.x) < (e.w*.48+15)){
        e.breached=true;
        const loss=Math.min(p.team-1,e.loss+Math.max(0,e.hp)/8);
        p.team=Math.max(1,p.team-loss);
        addText('-'+Math.floor(loss),p.x,H-210,'#ffb1b7',1,32);
        burst(p.x,H-180,'#ff9ca7',18,140);
        e.dead=true;
      }
      if(sy<-140) e.dead=true;
    }
    if(e.type==='crate' && !e.dead){
      if(sy>H-120) e.dead=true;
    }
    e.hitFlash=Math.max(0,(e.hitFlash||0)-dt);
  }
  state.entities=state.entities.filter(e=>!e.dead);

  if(state.boss && !state.boss.dead){
    const b=state.boss;
    if(!b.entered && screenY(b.y)<180)b.entered=true;
    if(b.entered){
      b.y = Math.max(state.progress+H-500,b.y - 25*dt);
      b.x = W*0.5 + Math.sin(elapsed*.9)*Math.min(130,W*.15);
      b.attackCooldown -= dt;
      if(b.attackCooldown<=0){
        b.attackCooldown = Math.max(1.4,3.3-level*.09);
        const loss=Math.min(p.team-1,5+level+p.weapon*0.4);
        p.team=Math.max(1,p.team-loss);
        p.hp=clamp(p.hp-(8+level*1.2),0,p.maxHp);
        addText('ボス攻撃!',p.x,H-235,'#ffd0d4',.9,26);
        burst(p.x,H-180,'#ff9ca7',18,150);
        if(p.hp<=0 || p.team<=1) return lose();
      }
    }
  }

  fire(dt);
  if(p.team<=1 || p.hp<=0) return lose();

  for(const t of state.texts){t.life-=dt;t.y-=dt*35}
  state.texts=state.texts.filter(t=>t.life>0);
  for(const s of state.particles){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=80*dt;s.life-=dt}
  state.particles=state.particles.filter(s=>s.life>0);
  for(const b of state.bullets){b.life-=dt}
  state.bullets=state.bullets.filter(b=>b.life>0);
}

function roundRect(x,y,w,h,r,fill,stroke,lw=1){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.lineWidth=lw;g.strokeStyle=stroke;g.stroke()}}
function label(txt,x,y,size=20,color='#fff',align='center',weight=900){g.font=`${weight} ${size}px system-ui,-apple-system,sans-serif`;g.textAlign=align;g.textBaseline='middle';g.fillStyle=color;g.fillText(txt,x,y)}

function drawWater(){
  const grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#0c4e70');grd.addColorStop(1,'#08334b');
  g.fillStyle=grd;g.fillRect(0,0,W,H);
  g.globalAlpha=.15;
  for(let i=0;i<16;i++){
    g.fillStyle=i%2?'#9de5ff':'#78c8f0';
    g.fillRect(-30,(i*60+(elapsed*40)%60),W+60,2);
  }
  g.globalAlpha=1;
}

function drawDock(){
  const left=W/2-roadWidth*.51,right=W/2+roadWidth*.51,top=72,bottom=H+10;
  const topW=(right-left)*.68;
  const cx=W*.5;
  g.beginPath();
  g.moveTo(cx-topW/2,top);
  g.lineTo(cx+topW/2,top);
  g.lineTo(right,bottom);
  g.lineTo(left,bottom);
  g.closePath();
  g.fillStyle='#b8bdc4';g.fill();
  g.strokeStyle='#858a92';g.lineWidth=2;g.stroke();
  // side rails / containers
  g.fillStyle='#8e949d';
  g.fillRect(0,H-36,W,36);
}

function drawStairs(e,sy){
  const scale=projectScale(sy);
  const h=e.h*scale;
  const x=projectX(e.x,sy)-e.w*scale/2;
  const stepH=26*scale;
  for(let yy=sy-h/2;yy<sy+h/2;yy+=stepH){
    const lit=((yy/stepH)|0)%2===0;
    roundRect(x,yy,e.w*scale,stepH-3,4,lit?'#4ea9ff':'#3f8bdb','#7ec8ff',1.2);
    label('+1',projectX(e.x,sy),yy+stepH*0.5-1,18*scale,'#f6fbff');
  }
}

function drawCrate(e,sy){
  g.save();g.translate(projectX(e.x,sy),sy);g.scale(projectScale(sy),projectScale(sy));
  const flash=e.hitFlash>0? '#ffd58f':'#b87a3f';
  roundRect(-e.w/2,-e.h/2,e.w,e.h,6,flash,'#f1c68a',2);
  for(let i=0;i<3;i++)g.fillRect(-e.w/2+14+i*(e.w-28)/3,-e.h/2+10,6,e.h-20);
  label(String(Math.max(0,Math.ceil(e.hp))),0,3,28,'#fff');
  const icon=e.reward==='weapon'?'🔫':e.reward==='drone'?'🚁':'👥';
  label(icon,0,-e.h/2-22,26,'#fff');g.restore();
}

function drawCrowd(e,sy){
  g.save();
  g.translate(projectX(e.x,sy),sy);g.scale(projectScale(sy),projectScale(sy));
  const cols=14,rows=6;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const px=(c-(cols-1)/2)*16 + (r%2?8:0);
      const py=(r-(rows-1)/2)*15;
      g.fillStyle=e.hitFlash>0?'#ffcfb9':'#d1495d';
      g.beginPath();g.arc(px,py,6,0,Math.PI*2);g.fill();
      g.fillStyle='#f2b7a8';
      g.beginPath();g.arc(px,py-7,4,0,Math.PI*2);g.fill();
    }
  }
  g.restore();
  const k=projectScale(sy),x=projectX(e.x,sy);
  roundRect(x-e.w*k/2,sy-e.h*k/2-14,e.w*k,10*k,4,'#792431');
  roundRect(x-e.w*k/2,sy-e.h*k/2-14,e.w*k*Math.max(0,e.hp/e.maxHp),10*k,4,'#ff7d8d');
}

function drawBoss(b,sy){
  g.save();
  g.translate(projectX(b.x,sy),sy);
  const s=Math.min(1.25,Math.max(.9,1+(170-sy)/700));
  g.scale(s,s);
  g.fillStyle=b.hitFlash>0?'#ffd5da':'#f0c7bb';
  g.beginPath();g.arc(0,-68,34,0,Math.PI*2);g.fill();
  roundRect(-55,-42,110,120,28,b.hitFlash>0?'#ffe3e6':'#d7b1a6','#a97670',3);
  roundRect(-72,-8,24,104,12,'#d1a39a','#9a6e66',3);
  roundRect(48,-8,24,104,12,'#d1a39a','#9a6e66',3);
  roundRect(-35,84,26,92,12,'#d1a39a','#9a6e66',3);
  roundRect(9,84,26,92,12,'#d1a39a','#9a6e66',3);
  g.fillStyle='#c83445';g.beginPath();g.arc(-16,-74,6,0,Math.PI*2);g.fill();g.beginPath();g.arc(16,-74,6,0,Math.PI*2);g.fill();
  g.restore();
}

function drawSquad(){
  const p=state.player;
  const baseY=H-165;
  const show=Math.min(34,Math.max(1,Math.floor(p.team)));
  const cols=Math.min(8,Math.ceil(Math.sqrt(show*1.6)));
  const rows=Math.ceil(show/cols);
  for(let i=0;i<show;i++){
    const row=(i/cols)|0, col=i%cols;
    const perRow=Math.min(cols,show-row*cols);
    const x=p.x + (col-(perRow-1)/2)*22 + (row%2?11:0);
    const y=baseY + row*20;
    g.fillStyle='#2f72be';g.beginPath();g.arc(x,y,10,0,Math.PI*2);g.fill();
    g.fillStyle='#f4d7b6';g.beginPath();g.arc(x,y-10,7,0,Math.PI*2);g.fill();
    g.fillStyle='#7ab7ff';g.fillRect(x-10,y-20,20,8);
  }
  if(p.team>show){
    roundRect(p.x+86,baseY+rows*10,90,32,16,'#09314e','#7bd7ff',2);
    label('+'+Math.max(0,Math.floor(p.team-show)),p.x+131,baseY+rows*10+16,18,'#effbff');
  }
}

function drawBullets(){
  g.lineCap='round';
  for(const b of state.bullets){
    g.globalAlpha=b.life/b.max;
    g.strokeStyle=b.color;
    g.lineWidth=b.color==='#88fff0'?5:3;
    g.shadowColor=b.color;
    g.shadowBlur=10;
    g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.tx,b.ty);g.stroke();
  }
  g.shadowBlur=0;g.globalAlpha=1;
}

function drawParticles(){
  for(const p of state.particles){
    g.globalAlpha=Math.min(1,p.life/p.max);
    g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fill();
  }
  g.globalAlpha=1;
}

function drawTexts(){
  for(const t of state.texts){
    g.globalAlpha=Math.min(1,t.life/t.max);
    label(t.txt,t.x,t.y,t.size,t.color);
  }
  g.globalAlpha=1;
}

function drawHUD(){
  const p=state.player;
  const topY=14;
  const compact=W<580;
  const barY=compact?114:14;
  // resource boxes
  const mini=[[ '🪙',state.coins+'M','#f6c65b'],['💎',state.gems+'M','#6bd7ff'],['⚡',state.energy+'M','#ffa44f']];
  for(let i=0;i<mini.length;i++){
    const x=12+i*84;
    roundRect(x,12,74,28,10,'rgba(8,25,42,.78)','rgba(255,255,255,.12)',1);
    label(mini[i][0],x+16,26,16,'#fff');
    label(mini[i][1],x+44,26,13,mini[i][2],'center',900);
  }
  roundRect(12,compact?51:48,110,52,12,'rgba(8,25,42,.82)','rgba(255,255,255,.12)',1);
  g.fillStyle='#7db5ff';g.beginPath();g.arc(36,compact?76:74,16,0,Math.PI*2);g.fill();
  label(String(Math.max(1,Math.floor(p.team))),83,compact?76:74,22,'#fff');
  label('部隊',36,compact?98:96,10,'#d6ebff');

  if(state.boss && !state.boss.dead){
    roundRect(W*.28,barY,W*.44,38,14,'rgba(20,6,12,.78)','rgba(255,255,255,.12)',1);
    const ratio=Math.max(0,state.boss.hp/state.boss.maxHp);
    roundRect(W*.28+8,barY+8,(W*.44-16)*ratio,22,10,'#ff4e62');
    label(String(Math.max(0,Math.ceil(state.boss.hp))),W*.5,barY+19,20,'#fff');
  } else {
    roundRect(W*.35,barY,W*.30,16,8,'rgba(255,255,255,.12)');
    roundRect(W*.35,barY,W*.30*Math.min(1,elapsed/(state.timeline[state.timeline.length-1].t||20)),16,8,'#71f5ff');
    label('ステージ '+level,W*.5,barY+25,14,'#dff9ff');
  }
  label('武器LV '+p.weapon, W-(compact?77:92), compact?65:28, 14,'#ffe08e');
  label('支援 '+p.drones, W-(compact?77:92), compact?88:48, 14,'#a8dcff');
  label('ボスを撃退',18,H-20,22,'#e8f4ff','left');
  label('SWARM v2.1',W-12,H-20,13,'#a9e4f5','right');
}

function draw(){
  g.clearRect(0,0,W,H);
  drawWater();
  drawDock();
  if(!state)return;
  const drawables=[];
  for(const e of state.entities){
    const sy=screenY(e.y);
    if(sy<-260 || sy>H+260)continue;
    drawables.push({e,sy});
  }
  if(state.boss && !state.boss.dead) drawables.push({e:state.boss,sy:screenY(state.boss.y)});
  drawables.sort((a,b)=>a.sy-b.sy);
  for(const d of drawables){
    const e=d.e,sy=d.sy;
    if(e.type==='stairs')drawStairs(e,sy);
    if(e.type==='crate')drawCrate(e,sy);
    if(e.type==='crowd')drawCrowd(e,sy);
    if(e.type==='boss')drawBoss(e,sy);
  }
  drawBullets();
  drawSquad();
  drawParticles();
  drawTexts();
  drawHUD();
}

function frame(ts){
  const dt=Math.min(.033,(ts-last||ts)/1000);last=ts;
  update(dt);draw();
  requestAnimationFrame(frame);
}

function pointerX(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)*W/r.width}
function setTarget(clientX){state && (state.player.targetX=clamp(clientX,W/2-roadWidth*.39,W/2+roadWidth*.39))}
cv.addEventListener('pointerdown',e=>{if(mode!=='playing')return;pointer={id:e.pointerId};setTarget(pointerX(e));try{cv.setPointerCapture(e.pointerId)}catch(err){};e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(mode!=='playing')return;if(pointer&&pointer.id===e.pointerId){setTarget(pointerX(e));e.preventDefault()}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,e=>{if(pointer&&pointer.id===e.pointerId)pointer=null}));
document.addEventListener('keydown',e=>{if(mode!=='playing')return;if(e.key==='ArrowLeft')state.player.targetX-=110;if(e.key==='ArrowRight')state.player.targetX+=110;state.player.targetX=clamp(state.player.targetX,W/2-roadWidth*.39,W/2+roadWidth*.39)});

menu();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
